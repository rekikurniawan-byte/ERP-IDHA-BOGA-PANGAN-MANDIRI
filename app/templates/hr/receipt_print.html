<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    {% include "hr/_doc_styles.html" %}
    <style>
        .doc-sheet.doc-receipt { min-height: 0; }
        .doc-receipt-table { width: 100%; border-collapse: collapse; margin: 14px 0 10px; font-size: 10.5pt; }
        .doc-receipt-table td { padding: 8px 0; border-bottom: 1px dotted var(--doc-line); vertical-align: top; }
        .doc-receipt-table td:first-child { width: 32%; color: var(--doc-muted); }
        .doc-receipt-words { font-style: italic; font-weight: 700; background: var(--doc-accent-soft); padding: 8px 10px !important; border-radius: 6px; }
        .doc-receipt-amount { display: inline-flex; gap: 12px; align-items: center; padding: 10px 18px; border: 2px solid var(--doc-ink); border-radius: 8px; transform: skewX(-8deg); }
        .doc-receipt-amount span { font-size: 8pt; text-transform: uppercase; letter-spacing: 0.08em; color: var(--doc-muted); transform: skewX(8deg); }
        .doc-receipt-amount strong { font-size: 16pt; transform: skewX(8deg); }
        .doc-receipt-date { margin-top: 14px; text-align: right; font-size: 9.5pt; }
        @media print {
            .doc-sheet.doc-receipt { height: 136mm; overflow: hidden; border-bottom: 1px dashed #c8c2bb; }
            .doc-sheet + .doc-sheet { page-break-before: auto; break-before: auto; }
            .doc-sheet:nth-of-type(2n + 1) { page-break-before: always; break-before: page; }
            .doc-sheet:first-of-type { page-break-before: auto; break-before: auto; }
        }
    </style>
</head>
<body>
    <div class="doc-toolbar">
        <span class="doc-toolbar-title">{{ title }}{% if receipts|length > 1 %} · {{ receipts|length }} lembar (2 per halaman A4){% endif %}</span>
        <span class="doc-toolbar-actions">
            {% if back_url %}<a class="doc-btn" href="{{ back_url }}">Kembali</a>{% endif %}
            <button class="doc-btn is-primary" type="button" onclick="window.print()">Cetak / Simpan PDF</button>
        </span>
    </div>
    {% for r in receipts %}
        {% include "hr/_receipt_sheet.html" %}
    {% endfor %}
</body>
</html>
