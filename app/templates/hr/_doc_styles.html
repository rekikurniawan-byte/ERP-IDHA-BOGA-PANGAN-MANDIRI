{#- Gaya cetak dokumen SDM (slip gaji, kwitansi). Berdiri sendiri: halaman cetak tidak memuat style.css. -#}
<style>
    :root {
        --doc-ink: #1c1917;
        --doc-muted: #6b6560;
        --doc-line: #e7e2dc;
        --doc-soft: #faf7f4;
        --doc-accent: #a33900;
        --doc-accent-soft: #fdf1ea;
        --doc-good: #166534;
        --doc-bad: #b42318;
        --doc-page: #eeebe7;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--doc-page);
        color: var(--doc-ink);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
        font-size: 10pt;
        line-height: 1.45;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .doc-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        background: #ffffff;
        border-bottom: 1px solid var(--doc-line);
        font-size: 13px;
    }

    .doc-toolbar .doc-toolbar-title { font-weight: 700; }
    .doc-toolbar .doc-toolbar-actions { display: flex; gap: 8px; }

    .doc-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--doc-line);
        background: #ffffff;
        color: var(--doc-ink);
        font: 600 13px/1 inherit;
        text-decoration: none;
        cursor: pointer;
    }

    .doc-btn.is-primary { background: var(--doc-accent); border-color: var(--doc-accent); color: #ffffff; }

    .doc-sheet {
        position: relative;
        width: 210mm;
        min-height: 148mm;
        margin: 18px auto;
        padding: 14mm 14mm 12mm;
        background: #ffffff;
        box-shadow: 0 8px 28px rgba(28, 25, 23, 0.10);
        overflow: hidden;
    }

    .doc-sheet + .doc-sheet { page-break-before: always; break-before: page; }

    .doc-watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 96pt;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: rgba(163, 57, 0, 0.07);
        transform: rotate(-24deg);
        pointer-events: none;
    }

    .doc-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding-bottom: 12px;
        border-bottom: 3px solid var(--doc-accent);
    }

    .doc-brand { display: flex; gap: 12px; align-items: center; }

    .doc-logo {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: var(--doc-accent);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 15pt;
        overflow: hidden;
    }

    .doc-logo img { width: 100%; height: 100%; object-fit: contain; background: #ffffff; }
    .doc-company { font-size: 13pt; font-weight: 800; letter-spacing: 0.01em; }
    .doc-company-sub { color: var(--doc-muted); font-size: 8.5pt; max-width: 90mm; }

    .doc-title { text-align: right; }
    .doc-title h1 { margin: 0; font-size: 18pt; letter-spacing: 0.08em; color: var(--doc-accent); }
    .doc-title .doc-meta { color: var(--doc-muted); font-size: 8.5pt; }
    .doc-title .doc-meta strong { color: var(--doc-ink); }

    .doc-ribbon {
        margin: 10px 0 12px;
        padding: 5px 10px;
        border-radius: 6px;
        background: var(--doc-accent-soft);
        color: var(--doc-accent);
        font-size: 8pt;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
    }

    .doc-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
        margin-bottom: 12px;
    }

    .doc-info table { width: 100%; border-collapse: collapse; }
    .doc-info td { padding: 3px 0; vertical-align: top; }
    .doc-info td:first-child { width: 40%; color: var(--doc-muted); }
    .doc-info td:last-child { font-weight: 600; }

    .doc-attendance {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        margin-bottom: 14px;
    }

    .doc-att {
        padding: 7px 4px;
        border: 1px solid var(--doc-line);
        border-radius: 8px;
        text-align: center;
        background: var(--doc-soft);
    }

    .doc-att strong { display: block; font-size: 13pt; }
    .doc-att span { font-size: 7.5pt; color: var(--doc-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .doc-att.is-bad strong { color: var(--doc-bad); }
    .doc-att.is-total { background: #ffffff; border-color: var(--doc-accent); }
    .doc-att.is-total strong { color: var(--doc-accent); }

    .doc-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .doc-table { width: 100%; border-collapse: collapse; }

    .doc-table caption {
        text-align: left;
        padding: 6px 8px;
        font-size: 8pt;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
        background: var(--doc-ink);
        border-radius: 6px 6px 0 0;
    }

    .doc-table.is-minus caption { background: var(--doc-accent); }
    .doc-table td, .doc-table th { padding: 6px 8px; border-bottom: 1px solid var(--doc-line); vertical-align: top; }
    .doc-table th { text-align: left; font-size: 8pt; color: var(--doc-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: var(--doc-soft); }
    .doc-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .doc-table small { display: block; color: var(--doc-muted); font-size: 7.8pt; }
    .doc-table tfoot td { font-weight: 800; border-bottom: 0; background: var(--doc-soft); }
    .doc-table .is-empty { color: var(--doc-muted); font-style: italic; }

    .doc-net {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        margin: 14px 0 12px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--doc-ink);
        color: #ffffff;
    }

    .doc-net span { font-size: 8pt; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
    .doc-net strong { font-size: 18pt; letter-spacing: 0.01em; }
    .doc-net em { display: block; font-size: 8.5pt; opacity: 0.85; margin-top: 2px; }

    .doc-section-title { margin: 12px 0 6px; font-size: 8.5pt; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--doc-accent); }

    .doc-notes { font-size: 8pt; color: var(--doc-muted); margin: 8px 0 0; padding-left: 16px; }
    .doc-notes li { margin-bottom: 2px; }

    .doc-sign {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-top: 16px;
        text-align: center;
        font-size: 9pt;
    }

    .doc-sign-box { height: 58px; display: flex; align-items: center; justify-content: center; }
    .doc-sign-box img { max-height: 58px; max-width: 180px; }
    .doc-sign-name { display: inline-block; min-width: 150px; padding-top: 4px; border-top: 1px solid var(--doc-ink); font-weight: 700; }

    .doc-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        padding-top: 8px;
        border-top: 1px dashed var(--doc-line);
        font-size: 7.5pt;
        color: var(--doc-muted);
    }

    .doc-foot code { font-family: Consolas, "Courier New", monospace; color: var(--doc-ink); font-size: 8.5pt; letter-spacing: 0.06em; }

    .doc-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 7.5pt; font-weight: 700; }
    .doc-badge.is-good { background: #e8f5ec; color: var(--doc-good); }
    .doc-badge.is-wait { background: #fff4e5; color: #9a5b00; }

    @media screen and (max-width: 820px) {
        .doc-sheet { width: auto; margin: 10px; padding: 16px; }
        .doc-info, .doc-columns { grid-template-columns: 1fr; }
        .doc-attendance { grid-template-columns: repeat(3, 1fr); }
        .doc-head { flex-direction: column; }
        .doc-title { text-align: left; }
    }

    @page { size: A4 portrait; margin: 10mm; }

    @media print {
        body { background: #ffffff; }
        .doc-toolbar { display: none; }
        .doc-sheet { margin: 0; width: auto; box-shadow: none; padding: 0; min-height: 0; }
    }
</style>
