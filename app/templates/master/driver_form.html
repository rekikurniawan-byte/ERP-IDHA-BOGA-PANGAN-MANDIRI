{% extends "layouts/base.html" %}

{% block content %}
<div class="hr-master-settings-page-shell" data-ui-section="true">
<div class="page-header">
    <div>
        <span class="eyebrow">{% if driver %}Edit Driver{% else %}Tambah Driver{% endif %}</span>
        <h1>{% if driver %}Edit Driver{% else %}Input Driver{% endif %}</h1>
        <p>Driver digunakan saat membuat delivery makanan.</p>
    </div>

    <div class="page-actions">
        <a href="{{ url_for('master.drivers') }}" class="btn app-btn-secondary">Kembali</a>
    </div>
</div>

<div class="app-card">
    <form method="POST" action="{% if driver %}{{ url_for('master.edit_driver', driver_id=driver.id) }}{% else %}{{ url_for('master.create_driver') }}{% endif %}" data-ui-form="true" class="app-form">
        {% include "components/csrf_token.html" %}
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Nama Driver</label>
                <input type="text" name="name" class="form-control app-input" value="{{ driver.name if driver else '' }}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Telepon</label>
                <input type="text" name="phone" class="form-control app-input" value="{{ driver.phone if driver else '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label">No Lisensi</label>
                <input type="text" name="license_number" class="form-control app-input" value="{{ driver.license_number if driver else '' }}">
            </div>

            <div class="col-md-12">
                <label class="checkbox-clean">
                    <input type="checkbox" name="is_active" {% if not driver or driver.is_active %}checked{% endif %}>
                    <span>Driver aktif</span>
                </label>
            </div>
        </div>

        <div class="form-actions mt-4">
            <button type="submit" class="btn app-btn-primary">
                {% if driver %}Simpan Perubahan{% else %}Simpan Driver{% endif %}
            </button>
        </div>
    </form>
</div>
</div>
{% endblock %}
